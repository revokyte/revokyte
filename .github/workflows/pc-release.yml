name: PC builds

# Every v* tag produces unsigned desktop binaries (Windows .exe, macOS .app)
# attached to the tag's GitHub release. Builds are unsigned on purpose —
# SmartScreen/Gatekeeper first-run notes live in the README's desktop section.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The default workflow token is read-only; attaching binaries to the tag's
# release (which the bump-os flow may have already created) needs write.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: windows-x64
            ext: exe
          - os: macos-latest
            suffix: macos-arm64
            ext: zip
          # Intel Macs; GitHub keeps this image supported through 2027.
          - os: macos-15-intel
            suffix: macos-x86_64
            ext: zip
          # The binary requires the build image's glibc or newer; for an
          # arm64 build add an ubuntu-*-arm entry with suffix linux-arm64.
          - os: ubuntu-latest
            suffix: linux-x86_64
            ext: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # setuptools_scm derives the version from the tag history.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Artifact names carry the human version: the tag without its leading
      # "v" (e.g. Revokyte-0.2.0-windows-x64.exe), or git-describe output on
      # manual (workflow_dispatch) runs.
      - name: Determine version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(git describe --tags --always | sed 's/^v//')"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ARTIFACT=Revokyte-$VERSION-${{ matrix.suffix }}" >> "$GITHUB_ENV"

      # A dedicated venv, so the legal-info manifest below reflects exactly
      # the app's environment — the runner's system python carries pipx &
      # friends that never end up in the binary. APP_PY is a native
      # forward-slash path that works in bash and as a subprocess target on
      # both platforms.
      - name: Install
        shell: bash
        run: |
          python -m venv appenv
          BIN="$PWD/appenv/bin"; [ -d "$BIN" ] || BIN="$PWD/appenv/Scripts"
          APP_PY=$("$BIN/python" -c 'import sys; print(sys.executable.replace("\\", "/"))')
          "$APP_PY" -m pip install --upgrade pip
          "$APP_PY" -m pip install ".[pc]" pyinstaller
          echo "APP_PY=$APP_PY" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: '"$APP_PY" -m PyInstaller --noconfirm packaging/pyinstaller/Revokyte.spec'

      # macOS 26 shrinks legacy .icns icons onto a gray compatibility plate;
      # only the new Icon Composer format (Assets.car + CFBundleIconName)
      # renders full-bleed. Compile the checked-in Revokyte.icon with the
      # runner's Xcode and inject it next to the legacy icns (which older
      # macOS keeps using), then re-seal the ad-hoc signature.
      - name: Liquid Glass icon (macOS 26+)
        if: runner.os == 'macOS'
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          mkdir -p build/liquid-icon
          if xcrun actool packaging/pyinstaller/icons/Revokyte.icon \
              --compile build/liquid-icon \
              --output-format human-readable-text --notices --warnings --errors \
              --output-partial-info-plist build/liquid-icon/partial.plist \
              --app-icon Revokyte --include-all-app-icons \
              --enable-on-demand-resources NO --development-region en \
              --target-device mac --minimum-deployment-target 26.0 \
              --platform macosx; then
            cp build/liquid-icon/Assets.car dist/Revokyte.app/Contents/Resources/
            /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string Revokyte" \
              dist/Revokyte.app/Contents/Info.plist
            codesign --force --deep -s - dist/Revokyte.app
            echo "Liquid Glass icon embedded ($XCODE)."
          else
            echo "::warning::actool could not compile Revokyte.icon; shipping legacy icns only"
          fi

      # Launch the binary that ships, headless, for two seconds of frames.
      # PyInstaller only bundles imports it can see statically, so a module
      # imported by name at runtime can be missing from a build that compiled
      # fine: v0.2.27 to v0.3.0 shipped without the skin modules and died at
      # startup on every platform. The app exits non-zero on any error while
      # starting or rendering. The log goes to a file because the windowed
      # Windows build has no stdout.
      - name: Smoke test
        shell: bash
        timeout-minutes: 5
        env:
          SDL_VIDEODRIVER: dummy
          IC_EXIT_AFTER_FRAMES: "120"
        run: |
          case "$RUNNER_OS" in
            macOS) APP=dist/Revokyte.app/Contents/MacOS/Revokyte ;;
            Windows) APP=dist/Revokyte.exe ;;
            *) APP=dist/Revokyte ;;
          esac
          export IC_CONFIG_PATH="$RUNNER_TEMP/smoke-config.json"
          export IC_DEBUG_LOG="$RUNNER_TEMP/smoke.log"
          status=0
          "$APP" || status=$?
          cat "$IC_DEBUG_LOG" || true
          exit $status

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Revokyte.app "dist/$ARTIFACT.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item dist/Revokyte.exe "dist/$env:ARTIFACT.exe"

      # A tarball rather than the bare ELF: it survives the trip through
      # GitHub with its executable bit intact.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf "dist/$ARTIFACT.tar.gz" Revokyte

      # Desktop sibling of the OS image's legal-info bundle: the binaries
      # aggregate GPL/LGPL/MIT/BSD components (this GPL app, LGPL pygame with
      # its vendored SDL libraries, Python, numpy, ...) whose licenses require
      # shipping the license texts and pointing at corresponding sources.
      # Build-host tools (PyInstaller & friends) never ship inside the binary,
      # so they stay out of the manifest. The app's own corresponding source
      # is the python-instrument-cluster-<tag>.tar.gz asset on the release.
      - name: Collect legal info (license manifest + texts)
        shell: bash
        run: |
          OUT=build/legal-info
          IGNORE="pip setuptools wheel pyinstaller pyinstaller-hooks-contrib altgraph macholib pefile pywin32-ctypes"
          mkdir -p "$OUT/licenses"
          pipx run pip-licenses --python "$APP_PY" \
            --format=csv --with-urls --ignore-packages $IGNORE \
            > "$OUT/manifest.csv"
          pipx run pip-licenses --python "$APP_PY" \
            --format=plain-vertical --with-license-file --no-license-path \
            --ignore-packages $IGNORE \
            > "$OUT/licenses/python-packages.txt"
          "$APP_PY" -m pip freeze > "$OUT/requirements-frozen.txt"
          cp LICENSE "$OUT/"
          cp -R LICENSES "$OUT/licenses/app"
          cp src/instrument_cluster/db/NOTICE.md "$OUT/licenses/track-db-NOTICE.md"
          cat > "$OUT/README" << EOF
          Third-party notices for the Revokyte desktop build ($ARTIFACT).

          manifest.csv                  every Python package bundled in the
                                        binary, with version, license, URL
          licenses/python-packages.txt  the packages' full license texts
          licenses/app/                 this application's own license (GPL-3.0)
          licenses/track-db-NOTICE.md   provenance of the bundled track database
          requirements-frozen.txt       the exact build environment

          Corresponding sources: this application's source is attached to the
          same GitHub release (python-instrument-cluster-*.tar.gz) and lives at
          https://github.com/revokyte/revokyte. Python package sources are the
          sdists on https://pypi.org for the pinned versions in manifest.csv;
          granturismo's is https://github.com/chrshdl/granturismo. The Python
          runtime (PSF-2.0) is from https://python.org. The PyInstaller
          bootloader embedded in the executable is GPL-with-exception,
          https://github.com/pyinstaller/pyinstaller. pygame wheels vendor
          SDL2 and friends (zlib/FTL/libpng licenses) — see
          https://github.com/pygame/pygame for their texts. Bundled fonts keep
          their license files in the source tree under
          src/instrument_cluster/assets/fonts/.
          EOF
          tar -C build -czf "dist/legal-info-$VERSION-${{ matrix.suffix }}.tar.gz" legal-info

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            dist/${{ env.ARTIFACT }}.${{ matrix.ext }}
            dist/legal-info-${{ env.VERSION }}-${{ matrix.suffix }}.tar.gz
          if-no-files-found: error

      # Creates the release for the tag if it doesn't exist yet, otherwise
      # appends the file to it.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/${{ env.ARTIFACT }}.${{ matrix.ext }}
            dist/legal-info-${{ env.VERSION }}-${{ matrix.suffix }}.tar.gz
